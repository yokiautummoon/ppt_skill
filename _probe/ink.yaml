# ink.yaml — C3 书法矢量字（brush）探针：实色 / 渐变 / 图片填充三态
# 字形 → custGeom 原生矢量形状（换机不丢字形），填充可实色/渐变/图片。
meta:
  title: 书法矢量字探针
  style_guide: deck
  slide: {w: 13.333, h: 7.5}
  margin: {l: 0.6, t: 0.6, r: 0.6, b: 0.6}
elements:
  - id: title
    type: text
    rect: [0.8, 0.62, 11.0, 0.7]
    text: 书法矢量字（brush）三态填充
    text_style: {fs: 26, bold: true, align: left}
  # 实色楷书
  - id: ink_solid
    type: brush
    rect: [0.8, 1.4, 3.4, 3.4]
    text: 水墨
    font: kai
    align: center
    anchor: middle
    style: {fill: '#1F2A44'}
  # 渐变楷书
  - id: ink_grad
    type: brush
    rect: [4.6, 1.4, 3.4, 3.4]
    text: 山河
    font: kai
    style: {grad: ['#2D6CDF', '#7AA2F7']}
  # 图片填充楷书（水墨纹理透出字形）
  - id: ink_img
    type: brush
    rect: [8.4, 1.4, 3.4, 3.4]
    text: 云海
    font: kai
    style: {image: assets/ink.png}
  - id: cap
    type: text
    rect: [0.8, 5.6, 11.0, 0.8]
    text: 左·实色 ／ 中·渐变 ／ 右·图片填充（字形矢量化，换机不丢）
    text_style: {fs: 16, align: center}
