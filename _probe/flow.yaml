
meta:
  title: flow
  style_guide: flowchart
  slide: {w: 13.333, h: 7.5}
  margin: {l: 0.5, r: 0.5, t: 0.5, b: 0.5}
palette:
  deep: "#1F2A44"
  blue: "#2D6CDF"
  warn: "#FFF3C4"
  bg: "#F2F5FA"
elements:
  - id: title
    type: text
    rect: [0.6, 0.5, 12.0, 0.9]
    text: "付款流程"
    text_style: {fs: 32, color: deep, bold: true, align: left}
  - id: g
    type: graph
    rect: [0.5, 1.6, 12.33, 5.4]
    start: start
    nodes:
      - {id: start, text: "开始", kind: src}
      - {id: pay, text: "发起支付", kind: proc}
      - {id: chk, text: "验签通过？", kind: judge}
      - {id: ok, text: "支付成功", kind: end}
      - {id: fail, text: "支付失败", kind: end}
    edges:
      - {from: start, to: pay}
      - {from: pay, to: chk}
      - {from: chk, to: ok, label: "是"}
      - {from: chk, to: fail, label: "否", way: orth}
    groups:
      - {id: g_main, label: "主流程", members: [start, pay, chk]}
