# -*- coding: utf-8 -*-
# 示例：typst 复杂精美排版链路（type: typst）—— 整页个人简历
#
# 本示例聚焦「复杂排版」：一整页精美个人简历由 typst 全量排版（双栏侧栏 +
# 时间线 + 点阵评级 + 标签胶囊），产物为整块图：
#   SVG（OOXML 2016+ svgBlip 矢量通道）为现代 PPT 显示主体；
#   PNG 300ppi 为栅格 fallback（旧版 PPT 显示）。
# 产物不可逐字编辑（内容型积木，数据红线约束，见 references/typst-chain.md）；
# format 语法速查见 https://typst.app/docs（本 skill 对齐 typst 0.15.x）。
#
# 设计语言参考 typst 官网 CV 模板 impressive-impression（Forty Seconds 双栏
# 侧栏风格），源码 examples/typst/assets/resume.typ 自包含、零 @preview 依赖。
# 页面尺寸即元素 rect（1in = 72pt）：源码显式 #set page → 自设页面即信任，
# 不自动围切（视图与目标框 1:1，渲染零重算）。
#
# 数据红线示范：meta.brief 即本页数据源，正文数字/机构/年份全部溯源 brief，
# 后续若走 --fix 修订，改动须仍能溯源（禁止编造）。
meta:
  title: typst 复杂精美排版 · 整页个人简历
  brief: >
    生成一页个人简历示例（虚构演示人物，数据红线示范：本页数据须溯源本 brief）。
    林知夏，高级产品设计师（设计系统方向），十年产品设计经验；主导设计系统
    「晓舟 UI」覆盖 5 条产品线、1200+ 组件、8 套主题，设计研发协作提效 47%。
    工作经历：2016–2019 栖木互动（北京）UI 设计师（12 个移动端项目，组件库
    复用率 60%）；2019–2022 云帆科技（杭州）资深产品设计师（数据可视化平台
    改版任务完成率 +32%，沉淀 40+ 通用图表组件与栅格规范）；2022–今 澜舟科技
    （上海）设计系统负责人（统筹 8 人设计平台组，接入 3 条业务线，年均节省
    900+ 人日）。项目：2020–2022「晓舟 UI」设计系统 0→1（设计令牌/组件/文档
    三层体系）；2021–2022 B 端数据沙盘改版（任务驱动信息架构重构，上线 6 个月
    留存 +28%）。教育：同济大学设计创意学院工业设计本科 2012–2016（主修用户
    研究与交互设计，毕业设计获学院优秀奖）。技能：设计系统 5/交互原型 4/用户
    研究 4/动效设计 3/前端协作 3/项目管理 3；语言：中文 5/英语 4；获奖：红点
    提名、年度设计奖、专利 ×2、UX 认证。
  slide: {w: 8.5, h: 11.0}          # 纵向简历页（US Letter 纵向整页）
  margin: {l: 0.35, t: 0.35, r: 0.35, b: 0.35}
elements:
  - id: resume
    type: typst
    # 显式页面声明写入 preamble（_explicit_page 检测 "#set page"）：自设页面即
    # 信任，引擎不自动围切 —— 视图与目标框 1:1（rect 7.8in×10.3in = 561.6×741.6pt），
    # 渲染零重算。resume.typ 体内同值 #set page 保留供独立编译，等值无害。
    preamble: "#set page(width: 7.8in, height: 10.3in, margin: 0pt)"
    rect: [0.35, 0.35, 7.8, 10.3]   # 简历区域：页面尺寸 = 此 rect（1in = 72pt）
    typst_src: assets/resume.typ    # 外链 .typ（相对 SPEC 目录；自包含源码）