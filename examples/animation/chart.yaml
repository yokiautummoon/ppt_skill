# 动画积木演示：安逸动画库 35 宏参数化
meta:
  title: 动画积木
  style_guide: deck
  slide: {w: 13.333, h: 7.5}
  # 功能演示降准：卡片为动画宏示例素材，非正文排版规范 demo（verify S1b 例外通道）
  params:
    style: {body_fs_min: 14}
palette:
  deep: "#1F2A44"
  accent: "#2D6CDF"
  soft: "#EAF1FB"
  white: "#FFFFFF"
  warn: "#E0A800"
elements:
  - id: title
    type: text
    rect: [0.9, 0.35, 11.5, 0.9]
    text: "动画积木 · 安逸动画库 35 宏"
    text_style: {fs: 36, color: deep}
    animation: {effect: 进入动画_自上浮入_改}
  - id: sub
    type: text
    rect: [0.9, 1.25, 11.5, 0.5]
    text: "enter / persist / emphasize / exit — COM 实时构造，预览为静态帧"
    text_style: {fs: 16, color: accent}
    animation: {effect: 进入动画_快速淡入}
  - id: card1
    type: shape
    kind: rounded_rect
    rect: [0.9, 2.0, 3.4, 3.4]
    text: "快速淡入"
    style: {fill: accent, border: none}
    text_style: {color: white, fs: 18}
    animation: {effect: 进入动画_快速淡入}
  - id: card2
    type: shape
    kind: rounded_rect
    rect: [4.7, 2.0, 3.4, 3.4]
    text: "安逸Q弹"
    style: {fill: deep, border: none}
    text_style: {color: white, fs: 18}
    animation: {effect: 进入动画_安逸Q弹}
  - id: card3
    type: shape
    kind: rounded_rect
    rect: [8.5, 2.0, 3.4, 3.4]
    text: "自下浮入·改"
    style: {fill: soft, border: accent}
    animation: {effect: 进入动画_自下浮入_改}
  - id: badge
    type: shape
    kind: oval
    rect: [0.9, 5.55, 3.4, 0.8]
    text: "持续 · 呼吸效果"
    style: {fill: warn, border: none}
    text_style: {color: white, fs: 14}
    animation: {effect: 持续动画_呼吸效果}
  - id: spin
    type: shape
    kind: oval
    rect: [4.7, 5.55, 3.4, 0.8]
    text: "持续 · 陀螺旋（顺）"
    style: {fill: accent, border: none}
    text_style: {color: white, fs: 14}
    animation: {effect: 持续动画_无限陀螺旋_顺}
  - id: glow
    type: shape
    kind: oval
    rect: [8.5, 5.55, 3.4, 0.8]
    text: "强调 · 两次放大"
    style: {fill: deep, border: none}
    text_style: {color: white, fs: 14}
    animation: {effect: 强调动画_两次放大}
  - id: exitcard
    type: shape
    kind: rounded_rect
    rect: [4.0, 6.6, 4.0, 0.7]
    text: "退出动画 · 自上浮出"
    style: {fill: deep, border: none}
    text_style: {color: white, fs: 14}
    animation: {effect: 退出动画_自上浮出}