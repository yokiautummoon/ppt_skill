# -*- coding: utf-8 -*-
# 示例 3：组织架构图（graph 容器 orientation: vertical）
#
# 组织树 = graph 容器的纵向 branch：orientation: vertical 时布局旋转 90°——
# 层 = 行（根在上、子在下），行内节点水平均分、同层同高同宽；
# 跨层连线强制 N/S 正对中点（上者出 S、下者入 N，不斜插角），
# 同层兄弟连边回退水平主轴 E/W（本示例"前端组→后端组"即同层回退）。
#
# 断行/尺寸：行高 = 面板高 ÷ 层数 × (1−gutter)，节点宽 = 文本需宽与
# 行内容纳上限取小（超宽自动断行）。纵向布局暂不做"子节点对齐父节点"
# （Sugiyama 分层），一行均分 —— 画更复杂的树请用 graph + 绝对定位混合。
meta:
  title: 组织架构
  style_guide: flowchart
  slide: {w: 13.333, h: 7.5}
  margin: {l: 0.5, r: 0.5, t: 0.5, b: 0.5}
  framework:
    background:
      fill: {grad: ["#FFFFFF", "#EAF1F9"]}
    header: {text: "组织架构 · 研发体系", align: right, fs: 10, color: deep}
    footer: {text: "内部资料 · 第 {page} 页", align: right, fs: 9, color: deep}
palette:
  deep: "#1F2A44"
elements:
  - id: title
    type: text
    rect: [0.6, 0.5, 12.0, 0.9]
    text: "组织架构（纵向布局）"
    text_style: {fs: 32, color: deep, bold: true, align: left}
  - id: org
    type: graph
    rect: [0.5, 1.6, 12.33, 5.4]
    orientation: vertical
    start: ceo
    group: true
    nodes:
      - {id: ceo, text: "总经理", kind: src}
      - {id: rd, text: "研发中心", kind: proc}
      - {id: mkt, text: "市场中心", kind: proc}
      - {id: fin, text: "财务中心", kind: proc}
      - {id: fe, text: "前端组", kind: proc}
      - {id: be, text: "后端组", kind: proc}
      - {id: qa, text: "测试组", kind: proc}
      - {id: brand, text: "品牌部", kind: proc}
      - {id: sales, text: "销售部", kind: proc}
      - {id: acct, text: "核算组", kind: proc}
      - {id: risk, text: "风控组", kind: proc}
    edges:
      - {from: ceo, to: rd, label: "直管"}
      - {from: ceo, to: mkt}
      - {from: ceo, to: fin}
      - {from: rd, to: fe}
      - {from: rd, to: be}
      - {from: rd, to: qa}
      - {from: mkt, to: brand}
      - {from: mkt, to: sales}
      - {from: fin, to: acct}
      - {from: fin, to: risk}
      - {from: fe, to: be, label: "协同"}
    groups:
      - {id: g_rd, label: "研发线", members: [rd, fe, be, qa]}