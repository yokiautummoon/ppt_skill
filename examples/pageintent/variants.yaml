# examples/pageintent/variants.yaml — 变体家族（variant families）：同 intent 不再逐页同貌
#
# 问题：一个 intent 只有一种几何展开 → 同一 deck 里 3 个 section 页像素级相同，
# 而 A1 版式多样性又豁免 intent 页 → 刻板无门禁可拦。
# 方案：每 intent 一族**审定变体**（scripts/intents.py::FAMILIES），选型确定性：
#   SPEC 显式 `variant:` 优先；缺省按该 intent 在本 deck 内的**出现次序轮换**。
#   本 deck：cover 显式 split；三个 section 未写 variant → 自动轮换
#   num_left → num_giant → band（三变体各一，观感各不相同）。
# 断言：每变体 = 布局代码 + verify 反向破格断言（贯穿/贴边/横贯），换文案不改签名，
#       换变体即换签名 → A1 版式多样性门禁把 intent 页一并计入（不再豁免）。
#
# 用法：win_py -X utf8 scripts/build_ppt.py examples/pageintent/variants.yaml --out out_variants
meta:
  title: 页型变体家族
  style_guide: deck
  slide: {w: 13.333, h: 7.5}
  margin: {l: 0.6, t: 0.6, r: 0.6, b: 0.6}
  framework:
    header: {text: "ppt-builder · 变体家族", align: right, fs: 10, color: muted}
    footer: {text: "第 {page} 页", align: right, fs: 9, color: muted}
  slides:
    # ============ 页 1：cover 变体 split（左纵贯色块 + 标题嵌块内） ============
    - title: 封面
      page_intent: cover
      framework: {footer: {text: ""}}
      cover:
        title: 同一种意图，不同的脸
        subtitle: 变体家族让节页不再千页一面
        meta: ppt-builder · 2026
        accent: acc
        variant: split

    # ============ 页 2：section 变体 num_left（首现 → 家族[0]） ============
    - title: 节一
      page_intent: section
      framework: {footer: {text: ""}}
      section:
        num: "01"
        title: 大数字左上纵贯
        accent: acc

    # ============ 页 3：section 变体 num_giant（第 2 次出现 → 家族[1]） ============
    - title: 节二
      page_intent: section
      framework: {footer: {text: ""}}
      section:
        num: "02"
        title: 巨型序号贴右下
        accent: acc

    # ============ 页 4：section 变体 band（第 3 次出现 → 家族[2]） ============
    - title: 节三
      page_intent: section
      framework: {footer: {text: ""}}
      section:
        num: "03"
        title: 序号与节名同嵌横贯色带
        accent: acc

    # ============ 页 5：内容页（对照：内容页骨架照旧走 A1 门禁） ============
    - title: 内容页对照
      elements:
        - id: title
          type: text
          rect: [0.6, 0.62, 11.9, 0.7]
          text: 变体家族怎么选
          text_style: {fs: 28, color: deep, bold: true, align: left}
        - id: ic_1
          type: icon
          rect: [1.95, 1.9, 1.0, 1.0]
          icon: 目标
          style: {color: '#2D6CDF', weight: 1.8}
        - id: card_1
          type: shape
          rect: [0.6, 3.1, 3.7, 1.6]
          kind: rounded_rect
          text: 显式优先
          style: {fill: '#EAF1FC'}
          text_style: {fs: 20, bold: true, color: deep, align: center}
        - id: body_1
          type: text
          rect: [0.6, 4.9, 3.7, 1.2]
          text: 写 [[variant 字段]] 即锁定该页形态
          text_style: {fs: 16, color: deep, align: center}
        - id: ic_2
          type: icon
          rect: [6.15, 1.9, 1.0, 1.0]
          icon: 图表
          style: {color: '#E0A800', weight: 1.8}
        - id: card_2
          type: shape
          rect: [4.8, 3.1, 3.7, 1.6]
          kind: rounded_rect
          text: 缺省轮换
          style: {fill: '#FDF4DA'}
          text_style: {fs: 20, bold: true, color: deep, align: center}
        - id: body_2
          type: text
          rect: [4.8, 4.9, 3.7, 1.2]
          text: 不写则按出现次序在家族内轮转
          text_style: {fs: 16, color: deep, align: center}
        - id: ic_3
          type: icon
          rect: [10.35, 1.9, 1.0, 1.0]
          icon: 安全
          style: {color: '#1FA88C', weight: 1.8}
        - id: card_3
          type: shape
          rect: [9.0, 3.1, 3.7, 1.6]
          kind: rounded_rect
          text: 门禁同规
          style: {fill: '#E4F5EF'}
          text_style: {fs: 20, bold: true, color: deep, align: center}
        - id: body_3
          type: text
          rect: [9.0, 4.9, 3.7, 1.2]
          text: 变体即签名，同变体重复仍受 [[上限]] 约束
          text_style: {fs: 16, color: deep, align: center}

palette:
  deep: "#1F2A44"
  acc: "#2D6CDF"
  muted: "#8899AA"
