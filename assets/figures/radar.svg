<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <symbol id="dot" overflow="visible">
      <circle cx="0" cy="0" r="7"/>
    </symbol>
  </defs>
  <!-- 背景面板 -->
  <rect x="20" y="20" width="360" height="260" rx="12" fill="#EAF1FC">
  </rect>
  <!-- 雷达网格（描边，非填充）：外围五边形 + 内圈五边形 + 辐条 -->
  <g stroke="#9DB6E8" stroke-width="1.5" stroke-linejoin="round" fill="none">
    <polygon points="200,60 305,145 255,245 145,245 95,145"/>
    <polygon points="200,115 265,165 240,220 160,220 135,165"/>
    <line x1="200" y1="60" x2="200" y2="245"/>
    <line x1="305" y1="145" x2="95" y2="145"/>
    <line x1="255" y1="245" x2="145" y2="245"/>
    <line x1="95" y1="145" x2="255" y2="245"/>
    <line x1="305" y1="145" x2="145" y2="245"/>
  </g>
  <!-- 数据区域（半透明填充） -->
  <polygon points="200,80 285,150 250,235 170,220 150,150" fill="#2D6CDF" fill-opacity="0.35">
  </polygon>
  <!-- 数据描边 + 顶点圆点 -->
  <polygon points="200,80 285,150 250,235 170,220 150,150" fill="none" stroke="#2D6CDF" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#2D6CDF">
    <use xlink:href="#dot" x="200" y="80"/>
    <use xlink:href="#dot" x="285" y="150"/>
    <use xlink:href="#dot" x="250" y="235"/>
    <use xlink:href="#dot" x="170" y="220"/>
    <use xlink:href="#dot" x="150" y="150"/>
  </g>
</svg>